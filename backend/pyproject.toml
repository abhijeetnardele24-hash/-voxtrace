[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voxtrace-backend"
version = "0.1.0"
description = "Deterministic temporal speech-feedback engine for VoxTrace."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
